# Netlify settings: no build step, publish this folder as it is.
[build]
  publish = "."

# Cache photos and styles for a week so repeat visits use less mobile data.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
