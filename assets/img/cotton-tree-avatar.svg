<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="ct-title">
  <title id="ct-title">The Cotton Tree of Freetown, Sierra Leone – illustration</title>
  <style>
    .flock { animation: drift 9s ease-in-out infinite alternate; }
    .flap { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .5s ease-in-out infinite alternate; }
    .flap:nth-child(2n) { animation-delay: -.25s; }
    .hop { animation: hop 1.1s ease-in-out infinite alternate; }
    .hop2 { animation-duration: 1.4s; animation-delay: -.5s; }
    .bob { animation: bob 2.2s ease-in-out infinite alternate; }
    .swing { transform-box: fill-box; transform-origin: 50% 0%; animation: swing 2.4s ease-in-out infinite alternate; }
    .wave { transform-box: fill-box; transform-origin: 0% 100%; animation: wave .7s ease-in-out infinite alternate; }
    .wave2 { animation-delay: -.35s; }
    @keyframes drift { from { transform: translateX(-24px); } to { transform: translateX(36px); } }
    @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.35); } }
    @keyframes hop { from { transform: translateY(4px); } to { transform: translateY(-16px); } }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
    @keyframes swing { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
    @keyframes wave { from { transform: rotate(-14deg); } to { transform: rotate(18deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6cc4"/>
      <stop offset=".62" stop-color="#8cc8ee"/>
      <stop offset="1" stop-color="#e7f4fc"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f675e"/>
      <stop offset=".45" stop-color="#a59a8c"/>
      <stop offset="1" stop-color="#5e574f"/>
    </linearGradient>
    <linearGradient id="leafDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f9a4a"/>
      <stop offset="1" stop-color="#1f5e2c"/>
    </linearGradient>
    <linearGradient id="leafLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc46a"/>
      <stop offset="1" stop-color="#3f8f45"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="256" cy="256" r="240"/></clipPath>
  </defs>

  <!-- gold ring -->
  <circle cx="256" cy="256" r="254" fill="#f6b313"/>
  <circle cx="256" cy="256" r="244" fill="#0d2a5c"/>

  <g clip-path="url(#circle)">
    <!-- sky -->
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- sun -->
    <circle cx="398" cy="118" r="34" fill="#f6b313" opacity=".95"/>
    <circle cx="398" cy="118" r="50" fill="#f6b313" opacity=".18"/>
    <!-- distant hills of Freetown -->
    <path d="M0 330 C60 290 110 300 160 316 C210 286 270 280 330 304 C380 284 440 290 512 318 V420 H0Z" fill="#4f8fc9" opacity=".55"/>
    <path d="M0 352 C70 330 140 338 200 350 C260 334 330 332 400 346 C450 336 490 340 512 346 V420 H0Z" fill="#3c78b4" opacity=".55"/>
    <!-- little houses -->
    <g fill="#e7f4fc" opacity=".9">
      <rect x="54" y="344" width="22" height="14"/><path d="M50 345 L65 334 L80 345Z" fill="#c75b3a"/>
      <rect x="92" y="348" width="18" height="11"/><path d="M89 349 L101 340 L113 349Z" fill="#c75b3a"/>
      <rect x="402" y="342" width="22" height="14"/><path d="M398 343 L413 332 L428 343Z" fill="#c75b3a"/>
      <rect x="440" y="346" width="18" height="12"/><path d="M437 347 L449 338 L461 347Z" fill="#c75b3a"/>
    </g>

    <!-- roundabout ground -->
    <rect x="0" y="380" width="512" height="140" fill="#8a8f96"/>
    <ellipse cx="256" cy="402" rx="190" ry="34" fill="#5f9e4f"/>
    <ellipse cx="256" cy="402" rx="190" ry="34" fill="none" stroke="#f2f2f2" stroke-width="6"/>
    <path d="M0 450 H512" stroke="#f2f2f2" stroke-width="5" stroke-dasharray="24 18"/>

    <!-- branches -->
    <g stroke="#6f675e" stroke-linecap="round" fill="none">
      <path d="M248 250 C220 220 170 214 120 200" stroke-width="14"/>
      <path d="M262 246 C292 216 344 210 396 196" stroke-width="14"/>
      <path d="M252 214 C236 180 206 160 176 146" stroke-width="11"/>
      <path d="M258 212 C276 178 306 160 340 146" stroke-width="11"/>
      <path d="M255 200 V120" stroke-width="12"/>
    </g>

    <!-- wide umbrella crown in tiers (kapok) -->
    <g>
      <ellipse cx="128" cy="196" rx="74" ry="30" fill="url(#leafDark)"/>
      <ellipse cx="386" cy="192" rx="78" ry="30" fill="url(#leafDark)"/>
      <ellipse cx="256" cy="168" rx="150" ry="44" fill="url(#leafDark)"/>
      <ellipse cx="182" cy="146" rx="78" ry="32" fill="url(#leafLight)"/>
      <ellipse cx="334" cy="144" rx="80" ry="32" fill="url(#leafLight)"/>
      <ellipse cx="256" cy="118" rx="96" ry="36" fill="url(#leafLight)"/>
      <ellipse cx="256" cy="94" rx="58" ry="24" fill="#8fd27a"/>
      <!-- leaf highlights -->
      <g fill="#a9e08f" opacity=".7">
        <ellipse cx="230" cy="100" rx="22" ry="7"/>
        <ellipse cx="160" cy="138" rx="24" ry="7"/>
        <ellipse cx="320" cy="134" rx="26" ry="7"/>
        <ellipse cx="110" cy="188" rx="22" ry="6"/>
        <ellipse cx="372" cy="184" rx="24" ry="6"/>
      </g>
    </g>

    <!-- trunk with buttress roots -->
    <path d="M238 196 C236 260 232 330 214 368 C196 384 168 392 148 398 L364 398 C344 392 316 384 298 368 C280 330 276 260 274 196 Z" fill="url(#bark)"/>
    <g fill="none" stroke="#5a534b" stroke-width="3" stroke-linecap="round" opacity=".7">
      <path d="M232 372 C222 386 196 394 172 398"/>
      <path d="M280 372 C290 386 316 394 340 398"/>
      <path d="M256 300 V396"/>
      <path d="M246 230 C244 270 242 300 240 330"/>
      <path d="M266 240 C268 280 270 310 272 340"/>
    </g>

    <!-- birds passing overhead -->
    <g class="flock" fill="none" stroke="#0d2a5c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path class="flap" d="M70 92 q9 -9 18 0 q9 -9 18 0"/>
      <path class="flap" d="M112 66 q7 -7 14 0 q7 -7 14 0"/>
      <path class="flap" d="M150 44 q6 -6 12 0 q6 -6 12 0"/>
      <path class="flap" d="M96 124 q6 -6 12 0 q6 -6 12 0"/>
      <path class="flap" d="M440 176 q6 -6 12 0 q6 -6 12 0"/>
    </g>

    <!-- monkeys -->
    <defs>
      <g id="monkeyHead">
        <circle cx="-8" cy="-2" r="4" fill="#7b4a28"/><circle cx="8" cy="-2" r="4" fill="#7b4a28"/>
        <circle cx="-8" cy="-2" r="2" fill="#d9a877"/><circle cx="8" cy="-2" r="2" fill="#d9a877"/>
        <circle r="8" fill="#7b4a28"/>
        <ellipse cy="2" rx="5.5" ry="4.5" fill="#d9a877"/>
        <circle cx="-2.6" cy="-1.5" r="1.3" fill="#1b120d"/><circle cx="2.6" cy="-1.5" r="1.3" fill="#1b120d"/>
        <path d="M-2 3.5 q2 1.8 4 0" stroke="#1b120d" stroke-width="1" fill="none" stroke-linecap="round"/>
      </g>
    </defs>
    <!-- jumping across the top of the crown -->
    <g transform="translate(300 64) rotate(-18)"><g class="hop">
      <path d="M-30 18 q-8 -4 -12 2 M-36 6 q-10 0 -14 6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".8"/>
      <path d="M-8 10 C-22 16 -26 0 -18 -2" stroke="#7b4a28" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <g stroke="#7b4a28" stroke-width="4" stroke-linecap="round">
        <path d="M4 -4 L16 -16"/><path d="M-2 -6 L6 -20"/>
        <path d="M-4 10 L-16 18"/><path d="M2 12 L-6 22"/>
      </g>
      <ellipse rx="8" ry="11" fill="#7b4a28"/>
      <ellipse cy="2" rx="4.5" ry="7" fill="#c08a5c"/>
      <use href="#monkeyHead" transform="translate(6 -14)"/>
    </g></g>
    <!-- sitting on the top of the tree -->
    <g transform="translate(212 72)"><g class="bob">
      <path d="M8 6 C22 8 22 -10 14 -12" stroke="#7b4a28" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <ellipse rx="8" ry="10" fill="#7b4a28"/>
      <ellipse cy="2" rx="4.5" ry="6" fill="#c08a5c"/>
      <g stroke="#7b4a28" stroke-width="4" stroke-linecap="round"><path d="M-6 -2 L-14 -14"/><path d="M-5 9 L-9 14"/><path d="M5 9 L9 14"/></g>
      <use href="#monkeyHead" transform="translate(0 -14)"/>
    </g></g>
    <!-- swinging from the left branch by its tail -->
    <g transform="translate(150 226)"><g class="swing">
      <path d="M0 -12 C-2 -22 6 -26 4 -18" stroke="#7b4a28" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <g transform="rotate(14)">
        <path d="M0 -10 C0 -2 0 2 0 4" stroke="#7b4a28" stroke-width="3.5"/>
        <ellipse cy="12" rx="8" ry="10" fill="#7b4a28"/>
        <ellipse cy="13" rx="4.5" ry="6" fill="#c08a5c"/>
        <g stroke="#7b4a28" stroke-width="4" stroke-linecap="round"><path d="M-6 16 L-14 26"/><path d="M6 16 L14 26"/></g>
        <use href="#monkeyHead" transform="translate(0 28) rotate(180)"/>
      </g>
    </g></g>
    <!-- leaping from the right branch -->
    <g transform="translate(392 222) rotate(24)"><g class="hop hop2">
      <path d="M-6 8 C-18 14 -22 2 -16 -2" stroke="#7b4a28" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <g stroke="#7b4a28" stroke-width="4" stroke-linecap="round">
        <path d="M4 -6 L10 -20"/><path d="M-3 -7 L-2 -21"/>
        <path d="M-4 9 L-10 20"/><path d="M3 10 L6 21"/>
      </g>
      <ellipse rx="8" ry="11" fill="#7b4a28"/>
      <ellipse cy="2" rx="4.5" ry="7" fill="#c08a5c"/>
      <use href="#monkeyHead" transform="translate(2 -15)"/>
    </g></g>

    <!-- children in Gaddiel blue standing under the tree -->
    <defs>
      <g id="kidFace">
        <circle r="13" fill="#7a4a2c"/>
        <circle cx="-4.5" cy="-1" r="1.8" fill="#1b120d"/><circle cx="4.5" cy="-1" r="1.8" fill="#1b120d"/>
        <circle cx="-7.5" cy="4" r="2.2" fill="#e08a7a" opacity=".55"/><circle cx="7.5" cy="4" r="2.2" fill="#e08a7a" opacity=".55"/>
        <path d="M-4 4.5 q4 4 8 0" stroke="#1b120d" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>
      <g id="boy">
        <rect x="-6" y="-16" width="4.5" height="14" fill="#7a4a2c"/><rect x="1.5" y="-16" width="4.5" height="14" fill="#7a4a2c"/>
        <ellipse cx="-4" cy="-1" rx="4.5" ry="2.4" fill="#1b120d"/><ellipse cx="4" cy="-1" rx="4.5" ry="2.4" fill="#1b120d"/>
        <rect x="-9" y="-24" width="18" height="10" rx="2" fill="#0d2a5c"/>
        <rect x="-11" y="-42" width="22" height="20" rx="6" fill="#5aa9e6"/>
        <path d="M-4 -42 L0 -36 L4 -42" fill="#ffffff"/>
        <path d="M-10 -38 L-15 -24" stroke="#7a4a2c" stroke-width="4.5" stroke-linecap="round"/>
        <use href="#kidFace" y="-55"/>
        <path d="M-13 -57 a13 13 0 0 1 26 0 q-13 -6 -26 0Z" fill="#1b120d"/>
      </g>
      <g id="girl">
        <rect x="-5.5" y="-14" width="4" height="12" fill="#7a4a2c"/><rect x="1.5" y="-14" width="4" height="12" fill="#7a4a2c"/>
        <ellipse cx="-4" cy="-1" rx="4.2" ry="2.3" fill="#1b120d"/><ellipse cx="4" cy="-1" rx="4.2" ry="2.3" fill="#1b120d"/>
        <path d="M-9 -42 H9 L14 -13 H-14Z" fill="#5aa9e6"/>
        <rect x="-9" y="-30" width="18" height="3" fill="#0d2a5c"/>
        <path d="M-4 -42 L0 -37 L4 -42" fill="#ffffff"/>
        <path d="M-9 -38 L-14 -25" stroke="#7a4a2c" stroke-width="4.2" stroke-linecap="round"/>
        <circle cx="-11" cy="-66" r="6" fill="#1b120d"/><circle cx="11" cy="-66" r="6" fill="#1b120d"/>
        <use href="#kidFace" y="-54"/>
        <path d="M-13 -56 a13 13 0 0 1 26 0 q-13 -5 -26 0Z" fill="#1b120d"/>
        <path d="M6 -68 l6 -4 v8z M18 -68 l-6 -4 v8z" fill="#f6b313"/>
      </g>
    </defs>
    <!-- each child: arm on the right side drawn separately (waving or down) -->
    <g transform="translate(150 414)">
      <use href="#girl"/>
      <path class="wave" d="M9 -38 L18 -56" stroke="#7a4a2c" stroke-width="4.2" stroke-linecap="round"/>
    </g>
    <g transform="translate(192 418)">
      <use href="#boy"/>
      <path d="M10 -38 L15 -24" stroke="#7a4a2c" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(322 418)">
      <use href="#girl"/>
      <path d="M9 -38 L14 -25" stroke="#7a4a2c" stroke-width="4.2" stroke-linecap="round"/>
    </g>
    <g transform="translate(364 414)">
      <use href="#boy"/>
      <path class="wave wave2" d="M10 -38 L19 -56" stroke="#7a4a2c" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- name label -->
  <rect x="96" y="440" width="320" height="42" rx="21" fill="#0d2a5c" stroke="#f6b313" stroke-width="4"/>
  <text x="256" y="469" text-anchor="middle" font-family="Fredoka, 'Trebuchet MS', Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1.5">COTTON TREE · FREETOWN</text>
</svg>
